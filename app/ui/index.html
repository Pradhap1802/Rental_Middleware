<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentAsst Middleware</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.75rem; font-weight: 700; background: linear-gradient(135deg, #a5b4fc, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .status-badge { background: #064e3b; color: #34d399; padding: 0.35rem 0.85rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; }
    .pulse { width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 8px #34d399; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .metric-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; }
    .metric-card .val { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; color: var(--text); }
    .metric-card .lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .card h2 { font-size: 1.15rem; margin-bottom: 1rem; color: var(--text); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    input, select { width: 100%; background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 0.65rem 0.85rem; border-radius: 6px; font-size: 0.9rem; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    button { background: var(--accent); color: white; border: none; padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .sync-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .sync-btn { background: #27272a; border: 1px solid var(--border); padding: 0.85rem; text-align: center; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
    .sync-btn:hover { border-color: var(--accent); background: #1e1e24; }
    .fetch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .fetch-btn { background: #334155; color: #a5b4fc; padding: 0.25rem 0.6rem; font-size: 0.75rem; border-radius: 4px; border: none; cursor: pointer; }
    .fetch-btn:hover { background: #475569; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>RentAsst Middleware Gateway</h1>
      </div>
      <div class="status-badge" id="service_status"><span class="pulse"></span> Service Active</div>
    </header>

    <!-- Operational Telemetry Tiles -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="lbl">Pending / Waiting</div>
        <div class="val" id="metric_pending">0</div>
      </div>
      <div class="metric-card">
        <div class="lbl">Retry Queue</div>
        <div class="val" id="metric_retry" style="color: var(--warning);">0</div>
      </div>
      <div class="metric-card">
        <div class="lbl">Completed Jobs</div>
        <div class="val" id="metric_completed" style="color: var(--success);">0</div>
      </div>
      <div class="metric-card">
        <div class="lbl">Failed Jobs</div>
        <div class="val" id="metric_failed" style="color: var(--error);">0</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>RentAsst System Settings</h2>
        <div class="form-group">
          <label>RentAsst API Endpoint</label>
          <input type="text" id="rentasst_url" value="http://localhost:8000/api">
        </div>
        <div class="form-group">
          <label>API Key / Token</label>
          <input type="password" id="rentasst_api_key" placeholder="Enter RentAsst API Token">
        </div>
        <div class="form-group">
          <div class="fetch-header">
            <label style="margin-bottom:0;">Business Code / Tenant ID</label>
            <button class="fetch-btn" onclick="fetchRentAsstCompanies()">🔄 Fetch Companies</button>
          </div>
          <input type="text" id="rentasst_tenant_id" placeholder="e.g. B100001" list="rentasst_tenant_list">
          <datalist id="rentasst_tenant_list"></datalist>
        </div>
        <div class="btn-group">
          <button onclick="testConnection('rentasst')">Test RentAsst API</button>
        </div>
      </div>

      <div class="card">
        <h2>External Target System Settings</h2>
        <div class="form-group">
          <label>External System Target URL (Tally / ERP)</label>
          <input type="text" id="external_url" value="http://localhost:9000">
        </div>
        <div class="form-group">
          <div class="fetch-header">
            <label style="margin-bottom:0;">Target Tally Company Name</label>
            <button class="fetch-btn" onclick="fetchTallyCompanies()">🔄 Fetch Open Companies</button>
          </div>
          <select id="tally_company_name">
            <option value="">-- Select or Open Tally Company --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Target API Key (Optional)</label>
          <input type="password" id="external_api_key" placeholder="Enter API Key if required">
        </div>
        <div class="btn-group">
          <button onclick="testConnection('external')">Test Connection</button>
          <button class="secondary" onclick="saveConfig()">Save All Config</button>
        </div>
      </div>
    </div>

    <!-- Manual Entity Synchronization -->
    <div class="card" style="margin-bottom: 2rem;">
      <h2>Manual Entity Synchronization</h2>
      <div class="sync-actions">
        <div class="sync-btn" onclick="triggerSync('customers')">👥 Customers Sync</div>
        <div class="sync-btn" onclick="triggerSync('equipment')">🚜 Equipment & Assets</div>
        <div class="sync-btn" onclick="triggerSync('rental_orders')">📄 Rental Contracts</div>
        <div class="sync-btn" onclick="triggerSync('invoices')">🧾 Invoices & Billing</div>
        <div class="sync-btn" onclick="triggerSync('payments')">💳 Payments & Deposits</div>
      </div>
    </div>
  </div>

  <script>
    async function loadStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) return;
        const data = await res.json();
        
        document.getElementById('metric_pending').innerText = data.queue_metrics.pending_jobs;
        document.getElementById('metric_retry').innerText = data.queue_metrics.running_jobs;
        document.getElementById('metric_completed').innerText = data.queue_metrics.completed_jobs;
        document.getElementById('metric_failed').innerText = data.queue_metrics.failed_jobs;
      } catch(e) {}
    }

    async function fetchTallyCompanies() {
      const select = document.getElementById('tally_company_name');
      const savedValue = select.getAttribute('data-saved-value') || select.value;
      try {
        const res = await fetch('/api/companies/tally');
        if (res.ok) {
          const data = await res.json();
          select.innerHTML = '<option value="">-- Select Company --</option>';

          if (data.companies && data.companies.length > 0) {
            data.companies.forEach(c => {
              const opt = document.createElement('option');
              opt.value = c.name;
              opt.textContent = c.name;
              select.appendChild(opt);
            });
            if (savedValue) {
              const matchingOpt = Array.from(select.options).find(o => o.value === savedValue);
              if (matchingOpt) select.value = savedValue;
            }
            if (data.companies.length === 1 && !savedValue) {
              select.value = data.companies[0].name;
            }
          } else {
            const opt = document.createElement('option');
            opt.value = savedValue || '';
            opt.textContent = savedValue ? savedValue + ' (Saved)' : '-- No open Tally company detected --';
            select.appendChild(opt);
          }
        }
      } catch(e) {
        console.error('Error fetching Tally companies:', e);
      }
    }

    async function fetchRentAsstCompanies() {
      try {
        const res = await fetch('/api/companies/rentasst');
        if (res.ok) {
          const data = await res.json();
          const datalist = document.getElementById('rentasst_tenant_list');
          datalist.innerHTML = '';
          if (data.companies && data.companies.length > 0) {
            data.companies.forEach(c => {
              const opt = document.createElement('option');
              opt.value = c.business_code || c.id || c.code;
              opt.innerText = c.business_name || c.name || opt.value;
              datalist.appendChild(opt);
            });
          }
        }
      } catch(e) {}
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          const cfg = await res.json();
          if (cfg.rentasst_url) document.getElementById('rentasst_url').value = cfg.rentasst_url;
          if (cfg.rentasst_api_key) document.getElementById('rentasst_api_key').value = cfg.rentasst_api_key;
          if (cfg.rentasst_tenant_id) document.getElementById('rentasst_tenant_id').value = cfg.rentasst_tenant_id;
          if (cfg.external_url) document.getElementById('external_url').value = cfg.external_url;
          if (cfg.tally_company_name) {
            const select = document.getElementById('tally_company_name');
            select.setAttribute('data-saved-value', cfg.tally_company_name);
            const opt = document.createElement('option');
            opt.value = cfg.tally_company_name;
            opt.textContent = cfg.tally_company_name;
            opt.selected = true;
            select.appendChild(opt);
          }
          if (cfg.external_api_key) document.getElementById('external_api_key').value = cfg.external_api_key;

          // Automatically fetch open companies from Tally XML Server
          fetchTallyCompanies();
          fetchRentAsstCompanies();
        }
      } catch(e) {}
    }

    async function saveConfig() {
      const cfg = {
        rentasst_url: document.getElementById('rentasst_url').value,
        rentasst_api_key: document.getElementById('rentasst_api_key').value,
        rentasst_tenant_id: document.getElementById('rentasst_tenant_id').value,
        external_url: document.getElementById('external_url').value,
        tally_company_name: document.getElementById('tally_company_name').value,
        external_api_key: document.getElementById('external_api_key').value,
        external_system_type: 'tally',
        auto_sync_enabled: true
      };
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cfg)
      });
      const data = await res.json();
      alert(data.message || 'Configuration Saved Successfully');
      loadStatus();
    }

    async function testConnection(target) {
      const res = await fetch(`/api/test/${target}`, { method: 'POST' });
      const data = await res.json();
      alert(data.message || 'Test Completed');
    }

    async function triggerSync(entity) {
      const res = await fetch(`/api/sync/${entity}`, { method: 'POST' });
      const data = await res.json();
      alert(`Sync completed for ${entity}: ` + (data.message || JSON.stringify(data)));
      loadStatus();
    }

    loadConfig();
    loadStatus();
    setInterval(loadStatus, 4000);
  </script>
</body>
</html>
